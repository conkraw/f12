# Example ONLY. Replace placeholders in your hosting provider's private Secrets.
# Use create_secrets.py to generate the password hash and an independent random key.
# Do not put actual values into this example or commit .streamlit/secrets.toml.
[app]
password_hash = "GENERATE_WITH_create_secrets.py"
# Add separately for Admin. Never replace an existing key to set this.
admin_password_hash = "GENERATE_WITH_set_admin_password.py"
encryption_key = "GENERATE_WITH_create_secrets.py"
github_enabled = false
clinical_use_approved = false
idle_minutes = 15

[github]
repository = "YOUR_ACCOUNT/YOUR_PRIVATE_DATA_REPOSITORY"
token = "FINE_GRAINED_TOKEN_FOR_DATA_REPOSITORY_ONLY"
branch = "main"
api_base = "https://api.github.com"
api_version = "2022-11-28"
